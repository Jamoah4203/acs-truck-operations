<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b1220"/><meta name="description" content="ACS Truck Operations — fleet, delivery, income, expense, maintenance and profitability management."/><meta name="application-name" content="ACS Truck Operations"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="apple-mobile-web-app-title" content="ACS Truck"/><meta name="mobile-web-app-capable" content="yes"/><link rel="icon" href="/icons/acs-truck.svg" type="image/svg+xml"/><link rel="apple-touch-icon" href="/icons/acs-truck.svg"/><title>ACS Truck Operations</title><style>html,body,#root{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb}#acs-boot{position:fixed;inset:0;display:grid;place-items:center;background:#f6f8fb;color:#0f172a;z-index:2147483640}.acs-boot-card{width:min(400px,calc(100% - 32px));text-align:center}.acs-boot-icon{width:50px;height:50px;margin:0 auto 14px;border-radius:14px;background:#ffb31a;display:grid;place-items:center;font-size:26px;box-shadow:0 10px 28px rgba(245,158,11,.25)}.acs-boot-card b{display:block;font-size:18px}.acs-boot-card small{display:block;margin-top:5px;color:#64748b}.acs-boot-bar{width:190px;height:7px;border-radius:999px;margin:18px auto 0;background:linear-gradient(90deg,#e2e8f0 25%,#fff 50%,#e2e8f0 75%);background-size:200% 100%;animation:boot 1.2s linear infinite}@keyframes boot{to{background-position:-200% 0}}#acs-recovery{display:none;margin-top:18px;padding:14px;border:1px solid #e2e8f0;border-radius:13px;background:#fff;text-align:left;box-shadow:0 12px 35px rgba(15,23,42,.08)}#acs-recovery b{font-size:13px}#acs-recovery small{line-height:1.45;margin:5px 0 10px}#acs-recovery-actions{display:flex;gap:7px;flex-wrap:wrap}#acs-recovery button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:8px 10px;font-weight:700;font-size:11px;cursor:pointer}#acs-recovery button:first-child{background:#0f172a;color:#fff;border-color:#0f172a}</style></head><body><noscript>ACS Truck Operations requires JavaScript.</noscript><div id="acs-boot"><div class="acs-boot-card"><div class="acs-boot-icon">🚚</div><b>ACS Truck Operations</b><small id="acs-boot-message">Opening your workspace…</small><div class="acs-boot-bar"></div><div id="acs-recovery"><b>Startup is taking longer than expected</b><small>The app may be waiting for the network or using an older cached release. You can safely check for the latest app version without deleting server data.</small><div id="acs-recovery-actions"><button id="acs-update-latest">Use latest version</button><button id="acs-reload">Retry</button><button id="acs-repair">Repair app cache</button></div></div></div></div><div id="root"></div><script>(function(){var boot=document.getElementById('acs-boot'),recovery=document.getElementById('acs-recovery'),msg=document.getElementById('acs-boot-message'),root=document.getElementById('root');function hide(){if(boot)boot.style.display='none'}function ready(){if(root&&root.children.length&&!root.querySelector('.prod-loading,.access-check'))hide()}window.__ACS_BOOT_HIDE__=hide;window.addEventListener('acs:app-ready',hide);if(root){new MutationObserver(ready).observe(root,{childList:true,subtree:true,attributes:true});ready()}setTimeout(function(){if(!root||!root.children.length||root.querySelector('.prod-loading,.access-check')){if(recovery)recovery.style.display='block';if(msg)msg.textContent=navigator.onLine?'Still starting… checking for a newer release.':'You appear to be offline. Cached data may still be available.'}},7000);async function updateLatest(){if(msg)msg.textContent='Checking for the latest release…';try{if('serviceWorker'in navigator){var reg=await navigator.serviceWorker.getRegistration();if(reg){await reg.update();if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});setTimeout(function(){location.reload()},1200);return}}location.reload()}catch(e){if(msg)msg.textContent='Update check failed. Try Repair app cache.'}}async function repair(){if(msg)msg.textContent='Repairing local app cache…';try{if('caches'in window){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return !k.startsWith('acs-truck-data')}).map(function(k){return caches.delete(k)}))}if('serviceWorker'in navigator){var reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}location.replace('/?recovery='+Date.now())}catch(e){location.reload()}}document.getElementById('acs-update-latest').onclick=updateLatest;document.getElementById('acs-reload').onclick=function(){location.reload()};document.getElementById('acs-repair').onclick=repair;if('serviceWorker'in navigator){navigator.serviceWorker.getRegistration().then(function(reg){if(reg)reg.update().catch(function(){})});navigator.serviceWorker.addEventListener('controllerchange',function(){if(!sessionStorage.getItem('acs-controller-reload')){sessionStorage.setItem('acs-controller-reload','1');location.reload()}else{sessionStorage.removeItem('acs-controller-reload')}})}})();</script><script type="module" src="/src/main.tsx"></script></body></html>
